[project]
name = "wsp-replication"
version = "0.1.0"
description = "Replication of 'Sparks of Weight-Space Programming' with Claude Opus 5.5"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.177",
    "minatar==1.0.15",
    "modal>=1.6.3",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "anthropic>=2.4.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "I"]
ignore = ["B905"]   # zip(strict=...) would change behaviour; every zip here pairs equal-length lists

[tool.ruff.lint.per-file-ignores]
# run as is in the model's kernel: its imports are names the model can use, and its line numbers show in tracebacks
"wsp/exp8_prelude.py" = ["E401", "F401", "I001"]
# one-off validation scripts, kept close to how they were run: style rules only
"checks/*" = ["E501", "E701", "E702", "E731", "E741", "SIM115"]
